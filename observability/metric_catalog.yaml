catalog_version: 1

metrics:
  - name: last_live_trade_age_seconds
    pillar: freshness
    description: "Đã bao lâu kể từ khi máy thu nhận trade live mới nhất?"
    group_by: [source, symbol_canonical]
    required_fields:
      - event_id
      - ingest_time
    optional_fields: [transport.is_snapshot]
    filter: "transport.is_snapshot is absent or false"
    deduplicate_by: event_id
    formula: "observed_at - max(ingest_time)"
    compute_every: "1m"
    unit: seconds
    when_no_trade_ever: null

  - name: ingest_delay_p95_ms
    pillar: freshness
    description: "Phân vị 95% độ trễ nhận trade trong một phút."
    group_by: [source, symbol_canonical]
    required_fields:
      - event_id
      - event_time
      - ingest_time
    optional_fields: [transport.is_snapshot]
    filter: "transport.is_snapshot is absent or false"
    deduplicate_by: event_id
    formula: "p95(ingest_time - event_time)"
    window: "1m"
    compute_every: "1m"
    unit: milliseconds
    when_no_trade_in_window: null
  - name: trade_count_1m
    pillar: volume
    description: "Số trade live khác nhau máy thu nhận trong một phút."
    group_by: [source, symbol_canonical]
    required_fields:
      - event_id
      - ingest_time
    optional_fields: [transport.is_snapshot]
    filter: "transport.is_snapshot is absent or false"
    deduplicate_by: event_id
    formula: "count_distinct(event_id) trong cửa sổ ingest_time 1 phút"
    window: "1m"
    compute_every: "1m"
    unit: trades
    when_window_observed_but_empty: 0
    when_source_unavailable: null

  - name: received_bytes_1m
    pillar: volume
    description: "Số byte message gốc recorder nhận trong một phút."
    group_by: [source]
    input: recorder_message
    required_fields: [source, received_at, raw_bytes]
    formula: "sum(raw_bytes) một lần cho mỗi message nhận trong phút"
    window: "1m"
    compute_every: "1m"
    unit: bytes
    status: needs_recorder_instrumentation
  - name: price_p50_5m
    pillar: distribution
    description: "Trung vị giá trade live nhận trong 5 phút."
    group_by: [source, symbol_canonical]
    value_field_by_source:
      binance: payload.p
      coinbase: payload.price
    numeric_type: decimal
    filter: "transport.is_snapshot is absent or false"
    deduplicate_by: event_id
    formula: "median(price) theo cửa sổ ingest_time 5 phút"
    window: "5m"
    compute_every: "1m"
    unit: quote_currency_per_base
    when_no_trade_in_window: null
    include_sample_count: true

  - name: trade_size_p95_5m
    pillar: distribution
    description: "Phân vị 95% kích thước trade trong 5 phút (S3: tính từ silver.trades)."
    group_by: [source, symbol_canonical]
    input: silver.trades
    value_field: qty
    value_field_by_source_in_raw:
      binance: payload.q
      coinbase: payload.size
      kraken: payload.qty
    numeric_type: decimal
    filter: "silver đã khử trùng theo (source, symbol, trade_id) và bỏ bản ghi trễ > 10 phút"
    formula: "approx_percentile(qty, 0.95) theo cửa sổ event_ts 5 phút, kết thúc 2 phút trước mốc tính"
    implemented_in: observability/collectors/table_metrics.py
    window: "5m"
    compute_every: "1m"
    unit: base_asset_units
    when_no_trade_in_window: null
    include_sample_count: true
  - name: contract_violation_count_1m
    pillar: schema
    implemented_in: observability/collectors/run_loop.py (S3)
    description: "Số bản ghi raw không đạt contract trong một phút."
    input: validation_result
    group_by: [source]
    required_result_fields: [checked_at, source, is_valid]
    formula: "count(records where is_valid == false)"
    window_by: "phút ingest_time của bản ghi (tất định khi tính lại; collector kiểm lại contract từ file raw)"
    window: "1m"
    compute_every: "1m"
    unit: records
    when_no_records_checked: null

  - name: contract_violation_rate_1m
    pillar: schema
    implemented_in: observability/collectors/run_loop.py (S3)
    description: "Tỷ lệ bản ghi raw không đạt contract trong một phút."
    input: validation_result
    group_by: [source]
    required_result_fields: [checked_at, source, is_valid]
    formula: "count(is_valid == false) / count(all records checked)"
    window_by: "phút ingest_time của bản ghi (tất định khi tính lại; collector kiểm lại contract từ file raw)"
    window: "1m"
    compute_every: "1m"
    unit: ratio
    when_no_records_checked: null
  - name: recorder_disconnect_count_5m
    pillar: pipeline_health
    description: "Số lần recorder mất kết nối trong 5 phút."
    input: recorder_ops_log
    group_by: [source]
    source_from: ops_log_filename
    timestamp_field: ts
    event_field: kind
    matching_kind: disconnected
    formula: "count(log entries where kind == 'disconnected')"
    window: "5m"
    compute_every: "1m"
    unit: events
    when_log_readable_but_no_match: 0
    when_log_unavailable: null

  - name: recorder_error_count_5m
    pillar: pipeline_health
    description: "Số lỗi recorder ghi nhận trong 5 phút."
    input: recorder_ops_log
    group_by: [source]
    source_from: ops_log_filename
    timestamp_field: ts
    event_field: kind
    matching_kinds: [idle_timeout, request_error]
    formula: "count(log entries where kind in ['idle_timeout', 'request_error'])"
    window: "5m"
    compute_every: "1m"
    unit: events
    when_log_readable_but_no_match: 0
    when_log_unavailable: null
  - name: cross_source_return_gap_5m
    pillar: cross_source
    description: "Độ chênh giữa mức biến động giá 5 phút của hai nguồn."
    input_metrics: [price_p50_5m]
    group_by: [comparison_pair]
    pair_mapping: required_explicitly
    formula: >
      abs(
        (price_p50_source_a_now / price_p50_source_a_previous - 1)
        -
        (price_p50_source_b_now / price_p50_source_b_previous - 1)
      )
    compare_windows: "Hai cửa sổ 5 phút liên tiếp, không chồng lấn"
    compute_every: "5m"
    unit: ratio
    when_either_source_missing: null
    when_any_price_is_zero: null
    status: needs_pair_mapping_and_baseline

  # ------------------------------------------------------------------ Sprint 3
  - name: table_freshness_seconds
    pillar: lineage
    description: "Tuổi snapshot mới nhất của một bảng Iceberg trong pipeline: bảng phía sau cũ dần khi job phía trước lỗi."
    group_by: [asset]
    input: "iceberg.<namespace>.<table>$snapshots (qua Trino)"
    assets: [bronze.trades_raw, bronze.binance_official_trades, silver.trades, gold.ohlcv_1m, gold.cross_exchange_spread]
    formula: "observed_at - max(committed_at)"
    compute_every: "1m"
    unit: seconds
    when_table_missing: null
    implemented_in: observability/collectors/table_metrics.py

  - name: return_1m_bps
    pillar: distribution
    description: "Lợi suất giá đóng cửa của phút so với phút trước, theo nguồn (đầu vào của detector C1)."
    group_by: [source, symbol_std]
    input: gold.ohlcv_1m
    formula: "(close_t / close_(t-1) - 1) * 10000"
    window: "1m"
    compute_every: "1m"
    settle_minutes: 2
    unit: basis_points
    when_previous_minute_missing: null
    implemented_in: observability/collectors/table_metrics.py

  - name: cross_source_spread_bps
    pillar: cross_source
    description: "Độ lệch giá đóng cửa giữa các sàn cho cùng tài sản; Binance định giá USDT nên có cả chênh USDT/USD."
    group_by: [symbol_std]
    input: gold.cross_exchange_spread
    formula: "(max(close) - min(close)) / median(close) * 10000, cần ít nhất 2 sàn"
    window: "1m"
    compute_every: "1m"
    settle_minutes: 2
    unit: basis_points
    when_fewer_than_two_sources: null
    implemented_in: observability/collectors/table_metrics.py

  - name: trading_freshness_seconds
    pillar: freshness
    description: "Số GIÂY GIAO DỊCH kể từ trade live cuối của mã cổ phiếu VN; nghỉ trưa, cuối tuần, ngày lễ không tính (C2)."
    group_by: [source, symbol_canonical]
    calendar: config/trading_calendar.yaml (HOSE)
    formula: "trading_seconds_between(max(ingest_time), observed_at)"
    compute_every: "1m"
    unit: trading_seconds
    when_no_trade_and_market_closed: null
    when_no_trade_and_market_open: "tính từ đầu phiên hôm nay"
    implemented_in: observability/slo/trading_calendar.py

# Pipeline health (S3): metric Prometheus, không ghi vào metric store.
pipeline_health_prometheus:
  - {name: finobs_stream_offsets_behind_latest, labels: [query, stat], meaning: "Kafka consumer lag của job Spark (min/avg/max offset chưa đọc)", from: platform/streaming/progress_exporter.py}
  - {name: finobs_stream_batch_duration_ms, labels: [query], meaning: "thời gian micro-batch gần nhất", from: platform/streaming/progress_exporter.py}
  - {name: finobs_stream_last_progress_timestamp_seconds, labels: [query], meaning: "lần cuối job có tiến độ (alert StreamStalled)", from: platform/streaming/progress_exporter.py}
  - {name: finobs_silver_late_rows_total, labels: [source], meaning: "bản ghi bị bỏ khỏi silver vì trễ quá 10 phút", from: platform/streaming/silver_gold.py}
  - {name: finobs_gold_last_minute_timestamp_seconds, labels: [], meaning: "phút gold mới nhất được tính (alert GoldStale)", from: platform/streaming/silver_gold.py}
  - {name: finobs_airflow_dag_last_run_success, labels: [dag_id], meaning: "lượt chạy DAG gần nhất thành công (1) hay thất bại (0)", from: observability/collectors/pipeline_exporter.py}
  - {name: finobs_producer_records_total, labels: [source, result], meaning: "bản ghi producer gửi, hợp lệ / vi phạm contract", from: platform/ingest/sinks.py}
  - {name: finobs_producer_ws_events_total, labels: [source, kind], meaning: "kết nối, mất kết nối WebSocket (thay cho recorder_disconnect_count_5m)", from: platform/ingest/sinks.py}
  - {name: finobs_producer_clock_offset_ms, labels: [], meaning: "lệch đồng hồ NTP của máy producer", from: platform/ingest/produce.py}

  # ------------------------------------------------------------------ Sprint 4: Completeness & Reconciliation
  - name: trade_id_gap_count
    pillar: completeness
    description: "Số khoảng hở trade ID riêng biệt trong cửa sổ kiểm tra."
    group_by: [source, symbol]
    required_fields: [event_id, ingest_time]
    formula: "count(distinct contiguous missing trade_id intervals)"
    unit: gaps

  - name: trade_id_gap_missing_total
    pillar: completeness
    description: "Tổng số trade ID bị thiếu qua tất cả khoảng hở trong cửa sổ."
    group_by: [source, symbol]
    required_fields: [event_id, ingest_time]
    formula: "sum(gap_end - gap_start + 1)"
    unit: trades

  - name: trade_id_duplicate_count
    pillar: completeness
    description: "Số trade ID xuất hiện nhiều hơn 1 lần trong cửa sổ."
    group_by: [source, symbol]
    required_fields: [event_id, ingest_time]
    formula: "count(trade_id where occurrences > 1)"
    unit: ids

  - name: trade_id_out_of_order_count
    pillar: completeness
    description: "Số lần trade ID nhận sau nhỏ hơn trade ID nhận trước (theo ingest_ts)."
    group_by: [source, symbol]
    required_fields: [event_id, ingest_time]
    formula: "count(i where trade_id[i] < trade_id[i-1])"
    unit: events

  - name: reconciliation_match_ratio
    pillar: reconciliation
    description: "Tỷ lệ trade khớp hoàn toàn giữa stream bronze và file chính thức Binance D+1."
    group_by: [source, symbol, date]
    formula: "matched_trades / official_trades"
    unit: ratio

  - name: reconciliation_missing_trades
    pillar: reconciliation
    description: "Số trade có trong file chính thức Binance nhưng thiếu trong stream bronze."
    group_by: [source, symbol, date]
    formula: "count(official_ids - stream_ids)"
    unit: trades

  - name: reconciliation_extra_trades
    pillar: reconciliation
    description: "Số trade có trong stream bronze nhưng không có trong file chính thức Binance."
    group_by: [source, symbol, date]
    formula: "count(stream_ids - official_ids)"
    unit: trades

  - name: reconciliation_value_mismatch
    pillar: reconciliation
    description: "Số trường (price, qty, time_ms) sai lệch vượt dung sai giữa stream và file chính thức."
    group_by: [source, symbol, date]
    formula: "count(mismatched fields among common trade_ids)"
    unit: fields
