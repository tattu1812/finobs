# Mô phỏng lệch đồng hồ collector qua timestamp; hiện tượng độ trễ âm từng được quan sát ở Sprint 1.
scenario_version: 1
id: S003_collector_clock_skew
title: Mô phỏng đồng hồ collector chậm 500 ms trên hai nguồn
fault_type: FT06_clock_skew
severity: medium
description: >
  Trừ 500 ms vào ingest_time của mọi bản ghi, cả hai nguồn, trong 10 phút.
  Với Binance (độ trễ thật p50 từng được đo khoảng 7 ms), nhiều bản ghi có
  thể cho độ trễ âm. Điểm phân biệt với lỗi mạng là nhiều mã và nhiều nguồn
  cùng dịch độ trễ một lượng tương tự. Scenario mô phỏng lỗi thời gian tại
  collector, không xác nhận nguyên nhân thực tế của các độ trễ âm từng thấy.
tags: [observed_in_sprint1, clock, multi_source]
input:
  mode: replay
  dataset: data/raw
  sources: [binance, coinbase]
  window:
    start: "2026-10-27T03:00:00.000Z"
    end: "2026-10-27T03:30:00.000Z"
  seed: 3

injection:
  injector: shift_ingest_time
  target:
    layer: host
    asset: "finobs:host.collector"
  start_offset_s: 600          # 03:10:00
  duration_s: 600
  params:
    offset_ms: -500
    drift_ms_per_hour: 0
ground_truth:
  is_incident: true
  fault_type: FT06_clock_skew
  start_offset_s: 600
  end_offset_s: 1200
  root_cause:
    asset: "finobs:host.collector"
    component: điểm tiêm shift_ingest_time mô phỏng đồng hồ collector
    explanation: >
      Benchmark dịch ingest_time sớm 500 ms nhằm mô phỏng đồng hồ collector
      chậm 500 ms. Độ trễ đo được ở các nguồn bị dịch chuyển; nguyên nhân
      của scenario là thao tác trên thời gian tại collector, không phải
      khẳng định lỗi đồng hồ thật hay lỗi từ hai sàn.
  affected_assets:
    - "finobs:raw.binance_trades"
    - "finobs:raw.coinbase_trades"
  expected_signals:
    - metric: ingest_delay_p95_ms
      group: { source: binance }
      direction: shift
      catalog_status: in_catalog
      note: giảm khoảng 500 ms, có thể xuống giá trị âm tùy dữ liệu nền
    - metric: ingest_delay_p95_ms
      group: { source: coinbase }
      direction: shift
      catalog_status: in_catalog
      note: giảm khoảng 500 ms; p99 từng được ghi nhận khoảng 272 ms, giá trị sau dịch tùy dữ liệu nền
    - metric: negative_delay_ratio_1m
      group: { source: binance }
      direction: up
      catalog_status: proposed
      note: tỷ lệ bản ghi có ingest_time nhỏ hơn event_time
  must_not_alert:
    - metric: trade_count_1m
      note: số lượng trade không đổi; báo volume ở đây là false positive
evaluation:
  detect_within_s: 120
  diagnose_within_s: 600
  rca_top_k: 3
  metrics: [MTTD, MTTDiag, precision, recall, AC@k]
