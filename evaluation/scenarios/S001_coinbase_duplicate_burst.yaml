# Mô phỏng nhân bản trade Coinbase; hiện tượng trùng đã được quan sát ở Sprint 1 nhưng chưa xác minh nguyên nhân thực tế.
scenario_version: 1
id: S001_coinbase_duplicate_burst
title: Mô phỏng trùng 5% trade BTC-USD và ETH-USD ở đầu vào Coinbase trong 2 phút
fault_type: FT03_duplicate_events
severity: medium
description: >
  Mô phỏng việc phát lại 5% trade của BTC-USD và ETH-USD ở đầu vào Coinbase
  trong 2 phút, giữ nguyên event_id. Hiện tượng trùng event_id từng được quan
  sát lúc 02:57:01 (7 trade BTC lặp lại), nhưng kịch bản không khẳng định
  nguyên nhân thực tế của hiện tượng đó. Window bắt đầu lúc 03:00 để không
  lẫn với lần trùng được ghi nhận. Pipeline phải khử trùng theo event_id:
  tổng khối lượng ở tầng gold không được thay đổi do các bản sao được tiêm.
tags: [observed_in_sprint1, coinbase, dedup]
input:
  mode: replay
  dataset: data/raw/coinbase/2026-10-27
  sources: [coinbase]
  symbols: [BTC-USD, ETH-USD]
  window:
    start: "2026-10-27T03:00:00.000Z"
    end: "2026-10-27T03:30:00.000Z"
  seed: 1
injection:
  injector: duplicate_records
  target:
    layer: source
    asset: "finobs:raw.coinbase_trades"
    source: coinbase
    symbols: [BTC-USD, ETH-USD]
  start_offset_s: 600          # 03:10:00
  duration_s: 120
  params:
    fraction: 0.05             # 5% bản ghi được gửi thêm một lần
    keep_event_id: true
    max_delay_ms: 50           # bản sao tới sau bản gốc tối đa 50 ms
ground_truth:
  is_incident: true
  fault_type: FT03_duplicate_events
  start_offset_s: 600
  end_offset_s: 720
  root_cause:
    asset: "finobs:raw.coinbase_trades"
    component: điểm tiêm duplicate_records trên luồng đầu vào Coinbase
    explanation: >
      Benchmark chủ động nhân bản trade giữ cùng event_id tại target source.
      Raw ghi nhận bản sao và có thể tạo duplicate ở tầng bronze. Đây là
      nguyên nhân được xác định trong scenario giả lập, không phải kết luận
      về nguyên nhân thật tại sàn Coinbase hoặc recorder.
  affected_assets:
    - "finobs:raw.coinbase_trades"
    - "finobs:bronze.trades"
  expected_signals:
    - metric: duplicate_ratio_1m
      group: { source: coinbase }
      direction: non_zero
      catalog_status: proposed
      note: (số bản ghi - số event_id khác nhau) / số bản ghi; dự kiến khoảng 0.05 trên 2 mã bị tiêm
  must_not_alert:
    - metric: trade_count_1m
      group: { source: coinbase }
      note: trade_count_1m đã khử trùng theo event_id nên không được tăng
evaluation:
  detect_within_s: 120
  diagnose_within_s: 600
  rca_top_k: 3
  metrics: [MTTD, MTTDiag, precision, recall, AC@k]
