scenario_version: 2
id: S015_coinbase_schema_drift_price
title: Coinbase BTC-USD đổi tên trường price thành last_price (FT07)
fault_type: FT07_schema_drift
severity: high
description: >
  Mô phỏng Coinbase đổi tên trường payload.price thành payload.last_price
  trong 3 phút, làm contract validator và downstream parse báo lỗi.
tags: [sprint5, coinbase, schema_drift]
input:
  mode: replay
  dataset: data/raw/coinbase/2026-10-27
  sources: [coinbase]
  symbols: [BTC-USD]
  window:
    start: "2026-10-27T13:00:00.000Z"
    end: "2026-10-27T13:30:00.000Z"
  seed: 15
injection:
  injector: rename_field
  target:
    layer: source
    asset: "finobs:raw.coinbase.trade"
    source: coinbase
    symbols: [BTC-USD]
  start_offset_s: 300
  duration_s: 180
  params:
    from_field: price
    to_field: last_price
ground_truth:
  is_incident: true
  fault_type: FT07_schema_drift
  start_offset_s: 300
  end_offset_s: 480
  root_cause:
    asset: "finobs:raw.coinbase.trade"
    component: payload schema của nguồn Coinbase BTC-USD
    explanation: >
      Đổi tên trường price -> last_price gây vi phạm data contract và thiếu giá ở silver.
  affected_assets:
    - "finobs:raw.coinbase.trade"
    - "finobs:bronze.trades_raw"
  expected_signals:
    - metric: contract_violation_rate
      group: { source: coinbase }
      direction: up
      catalog_status: in_catalog
evaluation:
  detect_within_s: 120
  diagnose_within_s: 300
  rca_top_k: 3
  metrics: [MTTD, MTTDiag, precision, recall, AC@k]
