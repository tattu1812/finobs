# Lỗi chưa gặp thật, nhưng là nhóm nguyên nhân gốc phổ biến nhất theo Foidl et al. (kiểu dữ liệu).
scenario_version: 1
id: S002_binance_schema_drift
title: Binance đổi trade id sang chuỗi và đổi tên trường giá trên ETHUSDT
fault_type: FT07_schema_drift
severity: high
description: >
  Từ phút thứ 5, payload của ETHUSDT trên Binance có trường "t" (trade id) đổi từ
  integer sang chuỗi, và trường "p" bị đổi tên thành "price". Lỗi chỉ xảy ra ở một mã
  của một nguồn, và kéo dài tới hết window. Detector phải báo vi phạm contract của
  Binance, còn agent phải chỉ ra node lineage raw của Binance là gốc.
tags: [contract, binance]

input:
  mode: replay
  dataset: data/raw/binance/2026-10-27
  sources: [binance]
  symbols: [BTCUSDT, ETHUSDT]
  window:
    start: "2026-10-27T03:00:00.000Z"
    end: "2026-10-27T03:20:00.000Z"
  seed: 2

injection:
  injector: mutate_payload
  target:
    layer: source
    asset: "finobs:raw.binance_trades"
    source: binance
    symbols: [ETHUSDT]
  start_offset_s: 300          # 03:05:00
  duration_s: 900              # tới hết window
  params:
    rename_fields: { p: price }
    cast_fields: { t: string }

ground_truth:
  is_incident: true
  fault_type: FT07_schema_drift
  start_offset_s: 300
  end_offset_s: 1200
  root_cause:
    asset: "finobs:raw.binance_trades"
    component: Binance WebSocket API (<symbol>@trade)
    explanation: >
      Sàn đổi cấu trúc payload mà không báo trước. Bản ghi không còn khớp
      binance_trade.schema.json (thiếu "p", sai kiểu "t"). BTCUSDT không bị ảnh hưởng.
  affected_assets:
    - "finobs:raw.binance_trades"
    - "finobs:bronze.trades"
  expected_signals:
    - metric: contract_violation_rate_1m
      group: { source: binance }
      direction: up
      catalog_status: in_catalog
      note: bằng khoảng tỷ trọng trade của ETHUSDT trong tổng trade Binance
    - metric: contract_violation_count_1m
      group: { source: binance }
      direction: non_zero
      catalog_status: in_catalog
  must_not_alert:
    - metric: contract_violation_rate_1m
      group: { source: coinbase }

evaluation:
  detect_within_s: 120
  diagnose_within_s: 600
  rca_top_k: 3
  metrics: [MTTD, MTTDiag, precision, recall, AC@k]
