# Đối chứng cho tín hiệu volume/distribution; không dùng để chấm lỗi duplicate ngoài phạm vi.
scenario_version: 1
id: S100_control_market_burst
title: "Đối chứng: đỉnh tải thật lúc 02:57:01 ở cả hai sàn"
fault_type: FT09_value_anomaly    # loại lỗi được kiểm tra báo nhầm, không phải sự cố có Ground Truth
severity: low
description: >
  Phát lại nguyên văn đoạn có đỉnh tải từng quan sát lúc 02:57:01
  (gấp 43 lần trung bình của Binance). Đỉnh xảy ra cùng giây ở Binance
  và Coinbase, được dùng làm đối chứng cho biến động thị trường thay vì
  lỗi giá trị FT09. Lưu ý: theo ghi nhận nguồn, chính giây đó có 7 trade BTC
  Coinbase trùng (FT03). Kịch bản này chỉ chấm các tín hiệu volume/distribution,
  không chấm tín hiệu trùng lặp.
tags: [negative_control, observed_in_sprint1, multi_source]
input:
  mode: replay
  dataset: data/raw
  sources: [binance, coinbase]
  window:
    start: "2026-10-27T02:50:00.000Z"
    end: "2026-10-27T03:05:00.000Z"

injection: null

ground_truth:
  is_incident: false
  must_not_alert:
    - metric: trade_count_1m
      note: số trade tăng đồng thời được dùng làm đối chứng trong phạm vi volume
    - metric: trade_size_p95_5m
    - metric: cross_source_return_gap_5m

evaluation:
  metrics: [false_positive_count]
