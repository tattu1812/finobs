{{- if .Values.trino.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finobs.fullname" . }}-trino
  labels:
    {{- include "finobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: trino
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.trino.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "finobs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trino
{{- end }}
