services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: finobs-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finobs-network

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: finobs-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - finobs-network

  spark-master:
    image: apache/spark:3.5.3
    container_name: finobs-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "${SPARK_UI_PORT:-8080}:8080"
    networks:
      - finobs-network
  iceberg-init:
    image: alpine:3.20
    container_name: finobs-iceberg-init
    user: root
    command: ["sh", "-c", "chown -R 1000:1000 /var/lib/iceberg"]
    volumes:
      - iceberg_catalog_data:/var/lib/iceberg
    restart: "no"
    networks:
      - finobs-network


  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: finobs-iceberg-rest
    depends_on:
      minio:
        condition: service_started
      iceberg-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://finobs-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
    volumes:
      - iceberg_catalog_data:/var/lib/iceberg
    networks:
      - finobs-network

  trino:
    image: trinodb/trino:477
    container_name: finobs-trino
    depends_on:
      - iceberg-rest
    ports:
      - "8081:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./configs/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    networks:
      - finobs-network

  spark-worker:
    image: apache/spark:3.5.3
    container_name: finobs-spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 1
      --memory 1G
    depends_on:
      - spark-master
    networks:
      - finobs-network

volumes:
  kafka_data:
  minio_data:
  iceberg_catalog_data:

networks:
  finobs-network:
    driver: bridge
