global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: spark-master
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-master:8080

  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets:
          - spark-worker:8081

  # Producer WebSocket -> Kafka: bản ghi, vi phạm contract, reconnect, lệch đồng hồ.
  - job_name: producer
    static_configs:
      - targets:
          - producer:8000

  # Pipeline health (S3): Kafka lag, thời gian micro-batch, bản ghi trễ của các job Spark.
  - job_name: spark-streaming
    static_configs:
      - targets:
          - bronze-stream:9108
          - silver-gold:9108

  # Trạng thái lượt chạy gần nhất của từng DAG Airflow (chỉ có khi bật profile ops).
  - job_name: airflow
    static_configs:
      - targets:
          - pipeline-exporter:8001

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
