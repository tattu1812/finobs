# Gửi mọi alert của FinObs vào một nhóm Telegram. Gom alert cùng tên trong 1 phút, nhắc lại sau 4 giờ.
route:
  receiver: telegram
  group_by: [alertname, source, query, dag_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /tmp/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
