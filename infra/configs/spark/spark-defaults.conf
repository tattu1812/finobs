# FinObs - cấu hình Spark dùng chung cho mọi job.
# Catalog "iceberg" trỏ tới Iceberg REST Catalog, dữ liệu nằm trên MinIO.
# Khóa truy cập MinIO không ghi ở đây: job đọc từ biến môi trường (xem platform/streaming/).

spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                rest
spark.sql.catalog.iceberg.uri                 http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse           s3://finobs-warehouse/
# ResolvingFileIO: s3:// -> S3FileIO, file:// -> HadoopFileIO. Cần khi bảng Iceberg là NGUỒN streaming
# (silver-gold đọc bronze): Iceberg ghi offset vào checkpoint cục bộ bằng FileIO của bảng, S3FileIO
# chỉ hiểu s3:// nên báo "Invalid S3 URI ... file:/checkpoints/...".
spark.sql.catalog.iceberg.io-impl             org.apache.iceberg.io.ResolvingFileIO
spark.sql.catalog.iceberg.s3.endpoint         http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.client.region       us-east-1
spark.sql.defaultCatalog                      iceberg

spark.sql.session.timeZone                    UTC
spark.ui.showConsoleProgress                  false
