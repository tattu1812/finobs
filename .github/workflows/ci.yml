name: FinObs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.9.10

      - name: Lint Python files
        run: ruff check .

      - name: Install validators and test dependencies
        run: pip install jsonschema==4.26.0 pyyaml==6.0.2 -r requirements-test.txt

      - name: Validate data contracts (fixtures)
        run: make validate-contracts PY=python VALIDATE_IN=tests/fixtures/raw

      - name: Validate evaluation scenarios (v2, v1 cũ, ca lỗi, unit test)
        run: make validate-scenarios PY=python

      - name: Test platform (producer Kafka writer, Binance official loader)
        run: make test-platform PY=python

      - name: Test agent tools (fake data, Marquez client, metric store)
        run: make test-agent PY=python

      - name: Test observability collectors
        run: make test-observability PY=python

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet

      # Build đủ 3 image tự viết để bắt lỗi Dockerfile (tải jar Maven, cài pyiceberg...).
      - name: Build Docker images
        run: docker compose --env-file .env -f infra/docker-compose.yml build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Lint Helm chart
        run: helm lint infra/helm/finobs

      - name: Render Helm templates
        run: helm template finobs infra/helm/finobs
