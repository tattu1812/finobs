# Cấu hình gộp cảnh báo thành sự cố và xếp hạng ưu tiên (AI-A, AI-C, Sprint 4).

grouping:
  # Hai cảnh báo cách nhau <= 600 giây (10 phút) và có liên hệ nguồn/mã/lineage sẽ được gộp
  window_seconds: 600

priority_weights:
  severity:
    critical: 100.0
    high: 60.0
    medium: 30.0
    low: 10.0
    info: 1.0
  asset_tier:
    gold: 40.0
    silver: 25.0
    bronze: 15.0
    raw: 10.0
    unknown: 5.0
  per_impacted_asset: 5.0
  per_source: 15.0
  per_minute_duration: 1.5
